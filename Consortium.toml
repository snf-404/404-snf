# 404-snf on STM32MP257: CA35 Linux application + CM33 real-time firmware.
#
# The CA35 owns the IWR6843 mmWave radar (serial), the BLE link (BlueZ), the ONNX
# fatigue pipeline, and the pneumatic actuation loop (pump PWM + pressure ADC) —
# no PWM-capable timer the CM33 could reach is free on the DK, so actuation runs
# on Linux. The CM33 is the independent safety supervisor: it holds a deadman on
# the CA35 heartbeat (over the IPC channel below) and cuts the pump power rail via
# one GPIO if Linux stops pinging. They exchange typed messages over one IPC
# channel. There is intentionally NO OP-TEE endpoint and NO HMI.
#
# Modeled on consortium/examples/melt-pot/stm32mp25 — see that example for the
# full set of knobs. Endpoint compile targets come from the embedded chip
# database, not this file.

[profile]
chip        = "stm32mp257fak3"
devkit      = "stm32mp257f-dk"
shared      = "./crates/shared"
deploy_root = "/opt/snf"
sysroot     = "/"
kernel_recipe = "linux-stm32mp"

[dts]
mode = "merge" # or "overlay"

[endpoints]
# Runtime endpoint name -> crate root. No `optee` endpoint (no TEE).
linux = "./crates/app"
cm33  = "./crates/mcu"

[dbg]
# "auto" forwards decoded CM33 defmt frames to the CA35 `tracing` subscriber.
mode = "auto"

# defmt ring for the CM33, in SRAM2 (see the stm32mp25 chip database), just
# above the IPC region below.
[dbg.cm33]
memory = { base = 0x00062000, length = 0x2000 }
mtu    = 64

# One shared-memory channel carrying pneumatic control both ways: the CA35
# sends `PneumaticCommand` (derived from the fatigue verdict), the CM33 sends
# back `PneumaticStatus` (measured pressure / pump state). Region lives in SRAM2.
[[ipc.channel]]
name          = "actuator"
doorbell      = "ipcc1"
pattern       = "memory"
primary       = "linux"
secondary     = "cm33"
party.linux   = { chan = 0, type = "PneumaticCommand" }
party.cm33    = { chan = 1, type = "PneumaticStatus" }
config.memory = { base = 0x00064000, length = 0x4000 }
mtu           = 128

# ── Peripheral ownership ─────────────────────────────────────────────────────

# IWR6843 radar data UART, owned by the application processor and read with
# tokio-serial in `snf-radar`. (Pin names are placeholders pending board design.)
[peripheral.usart1]
owner    = "ap"
secure   = false
pin.tx   = "PA9"
pin.rx   = "PA10"

# CM33 safety-interlock output: one GPIO driving the load-switch on the pump's
# motor rail. High = rail energized, Low = rail cut (fail-safe). The generated
# bring-up hands the CM33 a `gpioh` port handle; the firmware picks the pin. The
# specific pin is a placeholder pending board design.
[peripheral.gpioh]
owner  = "cm33"
secure = false
