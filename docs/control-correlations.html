  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed="true"],
    [aria-selected="true"],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id="snf-control-correlations" class="d-flex flex-column gap-4" aria-label="Control correlation plots"&gt;
  &lt;section aria-label="Confidence to weight plot"&gt;
    &lt;svg id="snf-confidence-plot" viewBox="0 0 736 300" role="img" aria-label="Weight is zero below confidence 0.30, follows an S curve to one at confidence 0.80, and stays at one thereafter" style="display:block;width:100%;height:auto"&gt;&lt;/svg&gt;
  &lt;/section&gt;
  &lt;section aria-label="Fatigue to GPIO balance plot"&gt;
    &lt;svg id="snf-fatigue-plot" viewBox="0 0 736 350" role="img" aria-label="GPIO high minus low balance across fatigue modes, including armed and unarmed canopy behavior" style="display:block;width:100%;height:auto"&gt;&lt;/svg&gt;
  &lt;/section&gt;
&lt;/div&gt;

&lt;style&gt;
  #snf-control-correlations {
    color: var(--foreground);
  }
  #snf-control-correlations svg {
    overflow: visible;
  }
  #snf-control-correlations .axis,
  #snf-control-correlations .grid,
  #snf-control-correlations .threshold {
    fill: none;
    vector-effect: non-scaling-stroke;
  }
  #snf-control-correlations .axis {
    stroke: var(--foreground);
    stroke-width: 1.25;
  }
  #snf-control-correlations .grid {
    stroke: var(--border);
    stroke-width: 1;
  }
  #snf-control-correlations .threshold {
    stroke: var(--muted-foreground);
    stroke-width: 1;
    stroke-dasharray: 5 5;
  }
  #snf-control-correlations .series-1,
  #snf-control-correlations .series-2,
  #snf-control-correlations .series-3 {
    fill: none;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  #snf-control-correlations .series-1 {
    stroke: var(--viz-series-1);
    stroke-width: 3;
  }
  #snf-control-correlations .series-2 {
    stroke: var(--viz-series-2);
    stroke-width: 3;
  }
  #snf-control-correlations .series-3 {
    stroke: var(--viz-series-3);
    stroke-width: 3;
    stroke-dasharray: 7 5;
  }
  #snf-control-correlations .transition-band {
    fill: var(--accent);
    opacity: 0.32;
  }
  #snf-control-correlations .mode-band {
    fill: var(--muted);
    opacity: 0.24;
  }
  #snf-control-correlations text {
    fill: var(--foreground);
    font-family: inherit;
    font-size: calc(var(--font-size-base) * 0.78);
    font-weight: 400;
  }
  #snf-control-correlations .secondary {
    fill: var(--muted-foreground);
  }
  #snf-control-correlations .key-line {
    stroke-width: 3;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById("snf-control-correlations");
  const ns = "http://www.w3.org/2000/svg";
  const make = (name, attrs = {}, textValue = "") =&gt; {
    const node = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, String(value)));
    if (textValue) node.textContent = textValue;
    return node;
  };
  const add = (parent, name, attrs = {}, textValue = "") =&gt; {
    const node = make(name, attrs, textValue);
    parent.appendChild(node);
    return node;
  };
  const pathFrom = (points, x, y) =&gt;
    points.map((point, index) =&gt; `${index ? "L" : "M"}${x(point[0]).toFixed(2)},${y(point[1]).toFixed(2)}`).join(" ");

  const drawAxes = (svg, frame, xTicks, yTicks, xLabel, yLabel) =&gt; {
    const { left, top, width, height, x, y } = frame;
    yTicks.forEach((tick) =&gt; {
      add(svg, "line", { x1: left, y1: y(tick), x2: left + width, y2: y(tick), class: "grid" });
      add(svg, "text", { x: left - 10, y: y(tick) + 4, "text-anchor": "end", class: "secondary" }, tick.toFixed(tick % 1 ? 1 : 0));
    });
    xTicks.forEach((tick) =&gt; {
      add(svg, "line", { x1: x(tick), y1: top, x2: x(tick), y2: top + height, class: "grid" });
      add(svg, "text", { x: x(tick), y: top + height + 24, "text-anchor": "middle", class: "secondary" }, tick.toFixed(tick % 1 ? 1 : 0));
    });
    add(svg, "line", { x1: left, y1: top + height, x2: left + width, y2: top + height, class: "axis" });
    add(svg, "line", { x1: left, y1: top, x2: left, y2: top + height, class: "axis" });
    add(svg, "text", { x: left + width / 2, y: top + height + 48, "text-anchor": "middle" }, xLabel);
    add(svg, "text", { x: 16, y: top + height / 2, "text-anchor": "middle", transform: `rotate(-90 16 ${top + height / 2})` }, yLabel);
  };

  const confidenceSvg = root.querySelector("#snf-confidence-plot");
  const confidenceFrame = {
    left: 68, top: 20, width: 640, height: 220,
    x: (value) =&gt; 68 + 640 * value,
    y: (value) =&gt; 20 + 220 * (1 - value)
  };
  add(confidenceSvg, "rect", {
    x: confidenceFrame.x(0.30),
    y: confidenceFrame.top,
    width: confidenceFrame.x(0.80) - confidenceFrame.x(0.30),
    height: confidenceFrame.height,
    class: "transition-band"
  });
  drawAxes(confidenceSvg, confidenceFrame, [0, 0.3, 0.55, 0.8, 1], [0, 0.25, 0.5, 0.75, 1], "Confidence, C", "Weight, W");
  const confidenceWeight = (confidence) =&gt; {
    if (confidence &lt; 0.30) return 0;
    if (confidence &gt;= 0.80) return 1;
    const t = (confidence - 0.30) / 0.50;
    const logistic = (value) =&gt; 1 / (1 + Math.exp(-value));
    const low = logistic(-4);
    const high = logistic(4);
    return (logistic(8 * (t - 0.5)) - low) / (high - low);
  };
  const confidencePoints = Array.from({ length: 501 }, (_, index) =&gt; {
    const confidence = index / 500;
    return [confidence, confidenceWeight(confidence)];
  });
  add(confidenceSvg, "path", { d: pathFrom(confidencePoints, confidenceFrame.x, confidenceFrame.y), class: "series-1" });
  [0.30, 0.80].forEach((threshold) =&gt; {
    add(confidenceSvg, "line", {
      x1: confidenceFrame.x(threshold), y1: confidenceFrame.top,
      x2: confidenceFrame.x(threshold), y2: confidenceFrame.top + confidenceFrame.height,
      class: "threshold"
    });
  });
  add(confidenceSvg, "text", { x: confidenceFrame.x(0.15), y: confidenceFrame.y(0.09), "text-anchor": "middle", class: "secondary" }, "withheld");
  add(confidenceSvg, "text", { x: confidenceFrame.x(0.55), y: confidenceFrame.y(0.89), "text-anchor": "middle", class: "secondary" }, "renormalized logistic (k = 8)");
  add(confidenceSvg, "text", { x: confidenceFrame.x(0.90), y: confidenceFrame.y(0.91), "text-anchor": "middle", class: "secondary" }, "full trust");

  const fatigueSvg = root.querySelector("#snf-fatigue-plot");
  const fatigueFrame = {
    left: 68, top: 42, width: 640, height: 240,
    x: (value) =&gt; 68 + 640 * value / 100,
    y: (value) =&gt; 42 + 240 * (1 - (value + 1) / 2)
  };
  [[0, 30], [30, 60], [60, 85], [85, 100]].forEach(([start, end], index) =&gt; {
    if (index % 2) {
      add(fatigueSvg, "rect", {
        x: fatigueFrame.x(start), y: fatigueFrame.top,
        width: fatigueFrame.x(end) - fatigueFrame.x(start),
        height: fatigueFrame.height, class: "mode-band"
      });
    }
  });
  drawAxes(fatigueSvg, fatigueFrame, [0, 30, 45, 60, 72.5, 85, 100], [-1, -0.5, 0, 0.5, 1], "Effective fatigue level, F", "GPIO balance, V = (H − L) / T");
  [30, 60, 85].forEach((threshold) =&gt; {
    add(fatigueSvg, "line", {
      x1: fatigueFrame.x(threshold), y1: fatigueFrame.top,
      x2: fatigueFrame.x(threshold), y2: fatigueFrame.top + fatigueFrame.height,
      class: "threshold"
    });
  });
  const baseSpeed = (fatigue) =&gt; {
    if (fatigue &lt; 30) return -1;
    if (fatigue &lt; 60) {
      const speed = 0.20 / (1 + Math.exp(-0.25 * (fatigue - 45)));
      return 0.8 * speed;
    }
    const coefficient = (1 - 0.35) / (12.5 * 12.5);
    const speed = Math.max(1 - coefficient * (fatigue - 72.5) ** 2, 0.35);
    return 0.8 * speed;
  };
  const unarmedPoints = [];
  for (let fatigue = 0; fatigue &lt;= 100; fatigue += 0.2) unarmedPoints.push([fatigue, baseSpeed(fatigue)]);
  add(fatigueSvg, "path", { d: pathFrom(unarmedPoints, fatigueFrame.x, fatigueFrame.y), class: "series-2" });
  const armedPoints = [];
  for (let fatigue = 85; fatigue &lt;= 100; fatigue += 0.2) armedPoints.push([fatigue, 0.8 * 0.15]);
  add(fatigueSvg, "path", { d: pathFrom(armedPoints, fatigueFrame.x, fatigueFrame.y), class: "series-3" });
  [["Idle / vent", 15], ["Nudge", 45], ["Cradle", 72.5], ["Canopy", 92.5]].forEach(([label, at]) =&gt; {
    add(fatigueSvg, "text", { x: fatigueFrame.x(at), y: 24, "text-anchor": "middle", class: "secondary" }, label);
  });
  add(fatigueSvg, "line", { x1: 386, y1: 316, x2: 416, y2: 316, class: "key-line", stroke: "var(--viz-series-2)" });
  add(fatigueSvg, "text", { x: 424, y: 320 }, "unarmed");
  add(fatigueSvg, "line", { x1: 522, y1: 316, x2: 552, y2: 316, class: "key-line", stroke: "var(--viz-series-3)", "stroke-dasharray": "7 5" });
  add(fatigueSvg, "text", { x: 560, y: 320 }, "canopy armed");
})();
&lt;/script&gt;

&lt;script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"&gt;&lt;/script&gt;
&lt;script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
&lt;/script&gt;
