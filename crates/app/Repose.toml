# Runtime configuration for `snf-app`, read from the directory holding the
# binary — `/opt/snf/app/Repose.toml`, next to `/opt/snf/app/snf-app`, under the
# shipped systemd unit. NOT the working directory.
#
# This file is the checked-in **template**: every key is shown at the value
# compiled into the binary, so a deployment can delete everything it does not
# need to change. Copy it beside the binary and edit:
#
#     scp crates/app/Repose.toml root@board:/opt/snf/app/Repose.toml
#
# Omitting the file entirely is fine and equivalent to this exact content —
# `snf-app` logs where it looked and runs on the defaults. A file that IS
# present, however, must be one the binary can honour: an unknown key or an
# unusable value stops start-up rather than silently reverting, because a
# misspelt `pwm_hz` quietly reading 40 is worse than a service that says why it
# will not come up.
#
# Everything here is a *wiring* fact — where the hardware is on this particular
# board. The bench-calibrated control values (neutral duty, charge ceiling,
# per-mode budgets) are not here; they live in `InflationParams` in
# `crates/bridge/src/inflation.rs`.

# ── Logging ──────────────────────────────────────────────────────────────────
# The `tracing` filter, in RUST_LOG syntax: this value IS what RUST_LOG would
# have been. `snf_app=debug,snf_radar=debug,info` while bringing a board up;
# `info` in service. A RUST_LOG in the environment still wins, so a one-off
# `RUST_LOG=trace ./snf-app` needs no edit here.
#
# This key is top-level, so it must stay ABOVE the first `[section]` header —
# anything after one belongs to that section.
#
# Under the shipped unit the output lands in /var/log/snf/snf-app.log; see
# `tools/deploy.sh`.
log = "info"

# ── Radar: the IWR6843's two UARTs ───────────────────────────────────────────
[radar]
# The sensor is on its USB virtual COM port, so both of its UARTs enumerate. An
# XDS110 ISK/BoosterPack presents the CLI port first and the data port second
# (`/dev/ttyACM0` and `/dev/ttyACM1`); a bare FTDI cable gives
# `/dev/ttyUSB0`/`/dev/ttyUSB1` instead. Check `dmesg` after plugging in.
#
# The two are not interchangeable. The CLI port takes the configuration profile
# at 115200 baud; the data port carries the binary TLV stream at 921600, and
# says NOTHING until the profile's last line, `sensorStart`, has been accepted.
data_port = "/dev/ttyUSB1"
baud_rate = 921600
cli_port = "/dev/ttyUSB0"
cli_baud_rate = 115200

# Send the profile when `snf-app` starts. Leave this on: the sensor boots idle,
# so an unconfigured one is indistinguishable from a broken cable. Turn it off
# only when something else owns the CLI port — a bench driving the same sensor
# from TI's mmWave Demo Visualizer, say — in which case that tool's `sensorStart`
# is what makes the data port speak.
configure_on_connect = true

# A TI `.cfg` profile to send instead of the built-in one. The built-in profile
# (`crates/radar/profiles/vital_signs_ISK_2m.cfg`, compiled into the binary)
# configures Vital Signs With People Tracking on an ISK at a 2 m mount, 90 ms
# frames — which is what these sensors are flashed with, so nothing is needed
# here. `protocol = "out-of-box"` DOES require a file, because the factory demo
# only streams what this build parses if it was configured by a factory profile.
#
# Both a plain `.cfg` and a pasted `mmwDemo:/>` session transcript are accepted.
# profile_path = "/opt/snf/radar.cfg"

# How long one configuration command may take to answer `Done`. The bound that
# matters is `sensorStart`, which replies only after RF calibration.
cli_timeout_ms = 5000

# Must match the firmware currently flashed on the sensor:
#   "vital-signs" — Radar Toolbox Vital Signs With People Tracking demo, what
#                   these boards run and what the built-in profile configures
#   "out-of-box"  — factory mmWave demo, Cartesian point TLVs; needs its own
#                   `profile_path` above
#
# It is never auto-detected: both demos share the magic word and the 40-byte
# header, so the wrong choice reads plausible nonsense rather than failing.
protocol = "vital-signs"

# Hard allocation bound for a declared UART packet, in bytes.
max_packet_length = 1048576

# ── Pneumatics: the two symmetric sections ───────────────────────────────────
[pneumatics]
# The breath carrier, in Hz. Both sections run it — two halves breathing at
# different rates is exactly the beat frequency a person notices — so there is
# one key here, not two.
#
# The usable band is 20–50 Hz: below it the pulsing is felt and heard as
# individual clicks, above it the valve armature cannot complete a cycle per
# period and the duty stops meaning an intake/exhaust ratio. Values outside the
# band are accepted but warned about, since a bench with faster valves is a real
# reason to leave it.
pwm_hz = 40

# Which `/sys/class/pwm/pwmchip{chip}/pwm{channel}` backs each section:
#
#   Section A  TIM4_CH2  PA1  connector pin 33
#   Section B  TIM5_CH1  PH8  connector pin 31
#
# `pwm-stm32` numbers channels by the TIMER's own channel index — CH1 is `pwm0`,
# CH2 is `pwm1` — regardless of how many the device tree exposes, which is why
# section A sits on channel 1 and section B on channel 0.
#
# The CHIP indices come from probe order and are not stable across kernel or
# device-tree changes. Re-derive them on a live board with:
#
#     for chip in /sys/class/pwm/pwmchip*; do \
#       echo "$chip -> $(readlink -f "$chip/device")"; done
#
# `40020000.timer` is TIM4 (section A); `40030000.timer` is TIM5 (section B).
# See hardware/pneumatics/README.md.
section_a = { chip = 4, channel = 1 }
section_b = { chip = 8, channel = 0 }

# ── Fatigue: the ONNX model ──────────────────────────────────────────────────
[fatigue]
# Built by `ml/` (`just ml-train`) and deployed here. Absent or
# unloadable, the binary still publishes vitals and status — it just runs
# without fatigue, and therefore without actuation.
model_path = "/opt/snf/fatigue.onnx"

# Reported to clients as the Fatigue payload's `model_revision`. Bump it
# whenever `model_path` is replaced, so a client can tell two models apart.
# 1 was the stub; 2/3 were earlier graphs; 4 is the six-feature linear model.
revision = 4

# ── BLE ──────────────────────────────────────────────────────────────────────
[ble]
# Which BlueZ adapter to advertise on: "hci0", "hci1", … Leave it out (as here)
# to take BlueZ's default adapter, which is what a board with one radio wants.
# adapter = "hci0"

# ── CM33: the optional start-up ping over the `radar` IPC channel ─────────────
[mcu]
# The IPC descriptor handshake happens during bring-up regardless; this is the
# separate question of whether anything is REPLYING on the far side.
#
# Off by default. The CM33's front-end reads USART6, which carries nothing in the
# virtual-COM configuration — a board whose CM33 is unflashed or held in reset
# senses, classifies, actuates and publishes exactly as one whose CM33 is up, so
# the check would report a problem the board does not have. Turn it on while
# bringing up the CM33 half, or for a build that wires the sensor to USART6.
#
# When on, it runs LAST — after the radar, model and BLE are up — and no reply is
# a warning, never a stop. Nothing is left running by skipping it: the transfer
# is a strict pull, so a CM33 nobody pings simply waits.
link_check = false

# How long to wait for that reply. The bound is the point: an unanswered receive
# on shared memory waits forever, which would hold start-up short of the main
# loop on any board whose CM33 is silent.
link_check_timeout_ms = 500
