# SPDX-License-Identifier: Apache-2.0

# This crate is built by the `consortium` build pipeline (`csti build`), which
# writes the generated `src/consortium.gen.rs` (UIO bring-up, IPC transceivers,
# defmt console) that `main.rs` `include!`s, then cross-compiles it for
# aarch64-unknown-linux-gnu. It is intentionally excluded from the workspace so
# it builds into its own per-crate `target/`, and therefore uses explicit paths
# and versions rather than workspace inheritance.
[package]
name        = "snf-app"
description = "404-snf CA35 Linux application: radar + fatigue + BLE + pneumatics"
version     = "0.1.0"
edition     = "2024"
license     = "Apache-2.0"

[[bin]]
name = "snf-app"
path = "src/main.rs"

# Everything is gated to Linux: the application target is
# aarch64-unknown-linux-gnu and the whole binary is `#![cfg(target_os = "linux")]`.
[target.'cfg(target_os = "linux")'.dependencies]
# Internal crates.
snf-shared  = { path = "../shared" }
# `serial` and `vital-signs` are both on by default: the IWR6843 reaches this
# board over its USB virtual COM port, so the radar is a Linux tty that
# `RadarStream` reads directly, and the sensors are flashed with Radar Toolbox's
# Vital Signs With People Tracking firmware. Named explicitly so a change to the
# crate's defaults cannot quietly change what this binary parses.
snf-radar   = { path = "../radar", features = ["serial", "vital-signs"] }
snf-ble     = { path = "../ble" }
# `ort` turns on real ONNX inference. It is off by default in `snf-fatigue` so
# that crate stays checkable on a macOS dev host; this is the build that has an
# ONNX Runtime, so this is where it goes on.
snf-fatigue = { path = "../fatigue" }
snf-bridge  = { path = "../bridge" }

# Named directly by the generated `consortium.gen.rs`.
consortium-codec = { path = "../../../consortium/crates/consortium-codec", features = ["postcard"] }
consortium-ipc = { path = "../../../consortium/crates/consortium-ipc", features = ["std"] }
consortium-ipc-doorbell-hsem = { path = "../../../consortium/crates/consortium-ipc-doorbell-hsem", features = ["std"] }
consortium-ipc-doorbell-ipcc = { path = "../../../consortium/crates/consortium-ipc-doorbell-ipcc", features = ["std"] }
consortium-ipc-transport-memory = { path = "../../../consortium/crates/consortium-ipc-transport-memory", features = ["std", "stm32mp25x"] }
consortium-shared-memory = { path = "../../../consortium/crates/consortium-shared-memory" }
consortium-runtime-app = { path = "../../../consortium/crates/consortium-runtime-app", features = ["stm32mp25x"] }
consortium-log = { path = "../../../consortium/crates/consortium-log", features = ["tracing"] }

# Application runtime.
serde              = { version = "1", features = ["derive"] }
tokio              = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# `Repose.toml` beside the binary: which tty, which pwmchips, which model. Parse
# only — nothing here ever writes TOML back out, so `display` stays off.
toml               = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pneumatic actuation: the FR120N driver is generic over embedded-hal 1.0's
# `SetDutyCycle`, and its PWM comes from the in-crate `sysfs_pwm` adapter over
# TIM4/TIM5. Low-side MOSFET switches need no direction or standby lines, so
# unlike the TB6612FNG this replaced, there are no GPIOs to claim and no
# `linux-embedded-hal` dependency.
embedded-hal = "1"
