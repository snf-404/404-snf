# SPDX-License-Identifier: Apache-2.0

[package]
name              = "snf-fatigue"
description       = "ONNX fatigue-level inference pipeline for 404-snf, built on consortium-ort"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Default builds a pure-Rust stub so `cargo check` needs no ONNX Runtime — that
# is what keeps this crate host-checkable on the macOS dev box, where there is
# no `libonnxruntime` and no aarch64-linux binary to download. `crates/app`
# turns `ort` on for the real build.
default = []
ort     = ["dep:ort"]

[dependencies]
serde           = { version = "1", features = ["derive"] }
# ORT directly rather than through `consortium-ort`: that crate is currently an
# empty re-export shell (its `lib.rs` is a licence header and nothing else), so
# there is no wrapper to use yet. Default features are deliberate —
# `download-binaries` + `copy-dylibs` fetch a matching ONNX Runtime and place it
# next to the binary, which is what makes this build on a bare container with no
# system ONNX Runtime installed.
ort             = { version = "2.0.0-rc.12", optional = true }

[lints]
workspace = true
