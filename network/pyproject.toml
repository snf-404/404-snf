[project]
name = "snf-net"
version = "0.1.0"
description = "Stage-A fatigue model for 404-snf: an analytic scoring rule distilled into a small MLP and exported to ONNX"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snf_net"]
